<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A simple PHP and MySQL TODO application.">

    <title>TODO App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <p class="eyebrow">Personal workspace</p>
                <h1>My tasks</h1>
                <p class="subtitle">Keep the important things moving.</p>
            </div>

            <div class="stats" aria-live="polite">
                <span id="todo-count">0 tasks left</span>
            </div>
        </header>


        <!-- Add Todo -->

        <section class="add-section">

            <form id="todo-form">

                <div class="input-row">

                    <input type="text" id="title" name="title" placeholder="What needs to be done?" maxlength="255"
                        required>

                    <button type="submit" class="add-button">
                        <span aria-hidden="true">+</span> Add task
                    </button>

                </div>

                <textarea id="description" name="description" placeholder="Description (optional)" rows="3"></textarea>

            </form>

        </section>


        <!-- Filters -->

        <div class="list-toolbar">
            <nav class="filters" aria-label="Task filters">
                <button class="filter active" data-filter="all" type="button" aria-pressed="true">
                    All
                </button>

                <button class="filter" data-filter="active" type="button" aria-pressed="false">
                    Active
                </button>

                <button class="filter" data-filter="completed" type="button" aria-pressed="false">
                    Completed
                </button>
            </nav>

            <button id="clear-completed" class="clear-completed hidden" type="button">
                Clear completed
            </button>
        </div>


        <!-- Todo List -->

        <section>

            <div id="loading" class="message">
                Loading...
            </div>

            <div id="error" class="message error hidden"></div>

            <div id="empty" class="message empty-state hidden">
                <span class="empty-icon" aria-hidden="true">✓</span>
                <strong>No tasks here</strong>
                <p>Add a task or choose another view.</p>
            </div>

            <div id="todo-list"></div>

        </section>

    </main>


    <!-- Edit Modal -->

    <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="edit-modal-title">Edit task</h2>

                <button id="close-modal" class="close-button" type="button" aria-label="Close edit dialog">
                    ×
                </button>

            </div>

            <form id="edit-form">

                <input type="hidden" id="edit-id">

                <label for="edit-title">
                    Title
                </label>

                <input type="text" id="edit-title" maxlength="255" required>

                <label for="edit-description">
                    Description
                </label>

                <textarea id="edit-description" rows="5"></textarea>

                <div class="modal-actions">

                    <button type="button" id="cancel-edit" class="secondary">
                        Cancel
                    </button>

                    <button type="submit">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>

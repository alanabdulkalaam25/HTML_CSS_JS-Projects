<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A simple PHP and MySQL TODO application."
    />

    <title>TODO App</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <header class="header">
        <div>
          <h1>Tasks</h1>
        </div>

        <button
          id="settings-button"
          class="settings-button"
          type="button"
          aria-label="Open database settings"
          title="Database settings"
        >
          <i class="fa-solid fa-gear" aria-hidden="true"></i>
        </button>
      </header>

      <!-- Add Todo -->

      <section class="add-section">
        <form id="todo-form">
          <div class="form-heading">
            <strong>Add a task</strong>
            <span>Press enter after filling in the title.</span>
          </div>
          <div class="input-row">
            <label class="sr-only" for="title">Task title</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="What needs to be done?"
              maxlength="255"
              required
            />

            <button type="submit" class="add-button">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
              <span>Add</span>
            </button>
          </div>

          <label class="sr-only" for="description">Task description</label>
          <textarea
            id="description"
            name="description"
            placeholder="Description (optional)"
            rows="3"
          ></textarea>
        </form>
      </section>

      <!-- Filters -->

      <div class="task-summary" aria-live="polite">
        <span id="todo-count">0 tasks left</span>
      </div>

      <div class="list-toolbar">
        <nav class="filters" aria-label="Task filters">
          <button
            class="filter active"
            data-filter="all"
            type="button"
            aria-pressed="true"
          >
            All
          </button>

          <button
            class="filter"
            data-filter="active"
            type="button"
            aria-pressed="false"
          >
            Active
          </button>

          <button
            class="filter"
            data-filter="completed"
            type="button"
            aria-pressed="false"
          >
            Completed
          </button>
        </nav>

        <button
          id="clear-completed"
          class="clear-completed hidden"
          type="button"
        >
          <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
          Clear completed
        </button>
      </div>

      <!-- Todo List -->

      <section>
        <div id="loading" class="message">Loading...</div>

        <div id="error" class="message error hidden"></div>

        <div id="empty" class="message empty-state hidden">
          <span class="empty-icon" aria-hidden="true">
            <i class="fa-solid fa-check"></i>
          </span>
          <strong>No tasks here</strong>
          <p>Add a task or choose another view.</p>
        </div>

        <div id="todo-list"></div>
      </section>
    </main>

    <!-- Edit Modal -->

    <div
      id="edit-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-modal-title"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="edit-modal-title">Edit task</h2>

          <button
            id="close-modal"
            class="close-button"
            type="button"
            aria-label="Close edit dialog"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <form id="edit-form">
          <input type="hidden" id="edit-id" />

          <label for="edit-title"> Title </label>

          <input type="text" id="edit-title" maxlength="255" required />

          <label for="edit-description"> Description </label>

          <textarea id="edit-description" rows="5"></textarea>

          <div class="modal-actions">
            <button type="button" id="cancel-edit" class="secondary">
              Cancel
            </button>

            <button type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="connection-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="connection-modal-title"
    >
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h2 id="connection-modal-title">Connect your database</h2>
            <p class="modal-intro">
              Enter a MySQL server. The database and todos table will be created
              automatically.
            </p>
          </div>
          <button
            id="close-connection"
            class="close-button"
            type="button"
            aria-label="Close database settings"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <form id="connection-form">
          <div class="connection-grid">
            <div>
              <label for="db-host">Host</label>
              <input
                id="db-host"
                name="host"
                placeholder="localhost"
                required
              />
            </div>
            <div>
              <label for="db-port">Port</label>
              <input
                id="db-port"
                name="port"
                type="number"
                min="1"
                max="65535"
                value="3306"
                required
              />
            </div>
          </div>
          <label for="db-name">Database name</label>
          <input id="db-name" name="database" value="todo_app" required />
          <label for="db-username">Username</label>
          <input id="db-username" name="username" placeholder="root" required />
          <label for="db-password">Password</label>
          <input
            id="db-password"
            name="password"
            type="password"
            autocomplete="current-password"
          />
          <p id="connection-error" class="form-error hidden" role="alert"></p>
          <div class="modal-actions">
            <button type="button" id="cancel-connection" class="secondary">
              Cancel
            </button>
            <button type="submit" id="connect-button">
              Connect and continue
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

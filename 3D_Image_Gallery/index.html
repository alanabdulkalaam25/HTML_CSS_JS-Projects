<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Rotating Image Gallery - HTML/CSS/JS Projects</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="image-container">
        <span style="--i: 1"
          ><img src="https://picsum.photos/id/227/300/200" alt="image"
        /></span>
        <span style="--i: 2"
          ><img src="https://picsum.photos/id/27/300/200" alt="image"
        /></span>
        <span style="--i: 3"
          ><img src="https://picsum.photos/id/23/300/200" alt="image"
        /></span>
        <span style="--i: 4"
          ><img src="https://picsum.photos/id/37/300/200" alt="image"
        /></span>
        <span style="--i: 5"
          ><img src="https://picsum.photos/id/30/300/200" alt="image"
        /></span>
        <span style="--i: 6"
          ><img src="https://picsum.photos/id/35/300/200" alt="image"
        /></span>
        <span style="--i: 7"
          ><img src="https://picsum.photos/id/39/300/200" alt="image"
        /></span>
        <span style="--i: 8"
          ><img src="https://picsum.photos/id/402/300/200" alt="image"
        /></span>
      </div>
      <div class="btn-container">
        <button class="btn" id="prev">Prev</button>
        <button class="btn" id="next">Next</button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>

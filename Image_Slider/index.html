<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider - HTML/CSS/JS Projects</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

  <body>
    <div class="slider-container">
      <div class="image-container" id="img-cont">
        <img src="https://picsum.photos/id/237/500/300" alt="" />
        <img src="https://picsum.photos/id/1/500/300" alt="" />
        <img src="https://picsum.photos/id/10/500/300" alt="" />
        <img src="https://picsum.photos/id/20/500/300" alt="" />

      <i class="fa-solid fa-angles-left btn prev" id="prev"></i>
      <i class="fa-solid fa-angles-right btn next" id="next"></i>
    </div>
    <script src="./script.js"></script>

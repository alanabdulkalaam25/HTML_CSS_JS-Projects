<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kanban Board</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">
      <div class="navbar-side">
        <span class="navbar-brand">KB</span>
      </div>

      <h1>Kanban Board</h1>

      <div class="navbar-side navbar-actions">
        <button
          type="button"
          id="themeToggle"
          class="theme-toggle"
          aria-label="Switch to dark theme"
          title="Switch theme"
        >
          <span id="themeIcon">☾</span>
        </button>
      </div>
    </nav>

    <!-- =========================
         MAIN APP
    ========================== -->

    <main class="app">
      <!-- Header -->

      <header class="app-header">
        <div>
          <p class="eyebrow">TASK MANAGEMENT</p>

          <h2>Stay organized. Get things done.</h2>

          <p class="subtitle">
            Drag tasks anywhere across the board to organize your workflow.
          </p>
        </div>

        <div class="total-tasks">
          <span id="totalTasks">0</span>

          <small>Total Tasks</small>
        </div>
      </header>

      <!-- Add Task -->

      <section class="add-task-section">
        <form id="taskForm">
          <div class="input-wrapper">
            <input
              type="text"
              id="taskInput"
              placeholder="What needs to be done?"
              maxlength="100"
              autocomplete="off"
            />

            <span id="characterCount">0/100</span>
          </div>

          <button type="submit" class="add-btn">
            <span>+</span>
            Add Task
          </button>
        </form>
      </section>

      <!-- =========================
             KANBAN BOARD
        ========================== -->

      <section class="board">
        <!-- TO DO -->

        <div class="column" data-status="todo">
          <div class="column-header">
            <div class="column-title">
              <span class="status-dot todo-dot"></span>

              <h3>To Do</h3>

              <span class="task-count" id="todoCount"> 0 </span>
            </div>

            <span class="column-description">
              Tasks waiting to be started
            </span>
          </div>

          <div class="task-list" id="todoList" data-status="todo"></div>
        </div>

        <!-- IN PROGRESS -->

        <div class="column" data-status="progress">
          <div class="column-header">
            <div class="column-title">
              <span class="status-dot progress-dot"></span>

              <h3>In Progress</h3>

              <span class="task-count" id="progressCount"> 0 </span>
            </div>

            <span class="column-description">
              Tasks currently being worked on
            </span>
          </div>

          <div class="task-list" id="progressList" data-status="progress"></div>
        </div>

        <!-- DONE -->

        <div class="column" data-status="done">
          <div class="column-header">
            <div class="column-title">
              <span class="status-dot done-dot"></span>

              <h3>Done</h3>

              <span class="task-count" id="doneCount"> 0 </span>
            </div>

            <span class="column-description">
              Successfully completed tasks
            </span>
          </div>

          <div class="task-list" id="doneList" data-status="done"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

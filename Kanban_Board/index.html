<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kanban Board</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">
      <div class="navbar-side">
        <span class="navbar-brand">KB</span>
      </div>

      <h1>Kanban Board</h1>

      <div class="navbar-side navbar-actions">
        <button
          type="button"
          id="themeToggle"
          class="theme-toggle"
          aria-label="Switch to dark theme"
          title="Switch to dark theme"
        >
          <span id="themeIcon">☾</span>
        </button>
      </div>
    </nav>

    <!-- =========================
         MAIN APP
    ========================== -->

    <main class="app">
      <!-- =========================
             ADD TASK
        ========================== -->

      <section class="add-task-section">
        <form id="taskForm">
          <div class="input-wrapper">
            <input
              type="text"
              id="taskInput"
              placeholder="What needs to be done?"
              maxlength="100"
              autocomplete="off"
            />

            <!-- Total tasks embedded inside input -->
            <div class="total-tasks" title="Total tasks">
              <span id="totalTasks">0</span>
              <small>Tasks</small>
            </div>

            <span id="characterCount" class="character-count"> 0/100 </span>
          </div>

          <button type="submit" class="add-btn">
            <span>+</span>
            Add Task
          </button>
        </form>
      </section>

      <!-- =========================
             KANBAN BOARD
        ========================== -->

      <section class="board">
        <!-- TO DO -->

        <div class="column" data-status="todo">
          <div class="column-header">
            <div class="column-title">
              <span class="status-dot todo-dot"></span>

              <h2>To Do</h2>

              <span class="task-count" id="todoCount"> 0 </span>
            </div>
          </div>

          <div class="task-list" id="todoList" data-status="todo"></div>
        </div>

        <!-- IN PROGRESS -->

        <div class="column" data-status="progress">
          <div class="column-header">
            <div class="column-title">
              <span class="status-dot progress-dot"></span>

              <h2>In Progress</h2>

              <span class="task-count" id="progressCount"> 0 </span>
            </div>
          </div>

          <div class="task-list" id="progressList" data-status="progress"></div>
        </div>

        <!-- DONE -->

        <div class="column" data-status="done">
          <div class="column-header">
            <div class="column-title">
              <span class="status-dot done-dot"></span>

              <h2>Done</h2>

              <span class="task-count" id="doneCount"> 0 </span>
            </div>
          </div>

          <div class="task-list" id="doneList" data-status="done"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

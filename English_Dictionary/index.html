<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Dictionary - HTML/CSS/JS Projects</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>English Dictionary</h1>
      <label for="input" class="visually-hidden">Search a word</label>
      <input
        id="input"
        type="text"
        placeholder="Search a Word"
        autocomplete="off"
      />
      <p id="infoTxt" aria-live="polite">Type a word and press ENTER!</p>
      <div class="result">
        <p>Word: <span class="title" id="title">hello</span></p>
        <p>Meaning: <span class="meaning" id="meaning">To say hi!</span></p>
        <audio src="" controls id="audio"></audio>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
